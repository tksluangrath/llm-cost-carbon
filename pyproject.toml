[project]
name = "llm-cost-carbon"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2",
    "mcp>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/llm_cost_carbon"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
